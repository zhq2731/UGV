conflict_resolver_node:
  # RViz Marker、冲突路段点和输入轨迹所在的坐标系。当前仿真使用 map。
  frame_id: map

  # 参与冲突判断的车辆数量。这里固定两车：vehicle_1 和 vehicle_2。
  vehicle_count: 2

  # 冲突预判与决策频率，单位 Hz。1.0 表示每秒判断一次。
  decision_rate: 1.0

  # 预测时间窗口，单位秒。只检查未来 prediction_horizon 秒内的轨迹冲突。
  prediction_horizon: 20.0

  # 车辆 footprint 外扩安全边界，单位米。越大越保守，越容易提前判定冲突。
  footprint_safety_margin: 0.7

  # 冲突决策总开关。false 时仍可运行节点，但不会输出有效冲突消解决策。
  enable_conflict_resolution: true

  # 先行车离开冲突区后，让行车进入冲突区前需要保留的时间间隔，单位秒。
  conflict_time_clearance: 5.0

  # 舒适减速度，单位 m/s^2。当前主要用于判断车辆是否已经来不及在冲突入口前停车。
  comfortable_deceleration: 2.0

  # 冲突判定阶段使用的停车可行性安全距离，单位米。planner 侧实际停车点由 conflict_resolution.yaml 控制。
  stop_margin: 1.0

  # 是否启用基于相对航向角的冲突类型分类。
  # true 时，先用 footprint 找候选重叠区域，再按两车候选轨迹的相对角度把重叠区切分为：
  # - 大角度冲突段；
  # - 小角度同向跟车段；
  # - 先同向后分离的分离冲突段。
  enable_conflict_type_classification: true

  # 大角度阈值，单位度。重叠采样点的两车轨迹相对航向角大于该值时，认为属于冲突段。
  conflict_angle_threshold_deg: 30.0

  # 小角度阈值，单位度。重叠采样点的两车轨迹相对航向角小于该值时，认为属于同向跟车段。
  following_angle_threshold_deg: 20.0

  # 角度分类的最小连续长度，单位米。
  # 无论冲突段还是跟车段，都必须沿候选轨迹连续满足角度条件至少该长度，才认为分类有效。
  angle_classification_min_length: 4.0

  # 先大角度冲突、后小角度汇入跟车时，冲突段终点向跟车段内延长的距离，单位米。
  # 这样冲突消解不会在刚汇入时立即释放，而是给后续跟车逻辑留出切换缓冲。
  conflict_follow_extension: 3.0

  # 一开始小角度跟车、后续大角度分离时，分离冲突段起点向前序跟车段回退的距离，单位米。
  # 这样车辆在分离角度明显变大之前就能提前进入保护区。
  divergence_conflict_back_distance: 3.0

  # FOLLOWING 状态释放滞回次数。本轮无 active FOLLOW 时不输出旧跟车约束，
  # 但连续丢失达到该次数后才清除 FOLLOWING 状态。
  following_release_count: 2

  # 跟车场景最大触发间距，单位米。超过该距离时不输出 FOLLOW 约束。
  following_detect_max_gap: 30.0

  # 跟车前后车双向投影判断的接近阈值，单位米。两侧投影都接近时不新建 FOLLOW。
  following_lead_tie_epsilon: 0.5

  # 静态优先级评分权重。priority 数字越小优先级越高；当前为 0 表示不参与软评分。
  priority_weight: 0.0

  # 当前车速评分权重。速度越高，临时停车代价越大，越倾向让其先行。
  speed_weight: 0.1

  # 路径进度评分权重。越接近通过冲突区域，越倾向继续先行。
  progress_weight: 0.25

  # TTC 评分权重。到达冲突区时间越短，越倾向继续先行。
  ttc_weight: 0.25

  # 让行延误评分权重。让行造成的预计延误越大，越倾向让其先行。
  yield_delay_weight: 0.25

  # 软评分差值小于该阈值时认为分数接近，转而使用静态优先级兜底。
  score_tie_epsilon: 0.02

  # 决策锁开关。开启后，同一对车辆一旦形成先行/让行关系，就维护为一个冲突事件：
  # - 角色不随单帧评分抖动切换；
  # - 冲突入口/出口使用 map 绝对坐标记录，并在每轮重新投影到当前候选轨迹；
  # - 同一事件的冲突区域只允许扩展，不因某一帧预测变短而收缩。
  # - 一旦先行车驶出动态维护的冲突出口，就释放该 pair 决策锁。
  enable_decision_lock: true

  # 冲突可视化 MarkerArray 输出话题，RViz 中订阅该话题显示冲突区间和 YIELD/PROCEED 标签。
  conflict_markers_topic: /trajectory_conflict/markers

  # 航向补偿角，单位度。若车体模型航向与轨迹 theta 存在固定偏差，可在这里补偿。
  heading_compensation_degree: 0.0

  # 每辆车的输入/输出话题与车辆尺寸配置。
  vehicles:
    "0":
      # 车辆字符串 ID，会写入 ConflictConstraint.ego_id / peer_id。
      id: vehicle_1

      # 静态优先级，数字越小优先级越高。仅在软评分接近或需要优先级兜底时使用。
      priority: 0

      # 名义速度，单位 m/s。用于部分预测兜底和评分归一化。
      nominal_speed: 2.0

      # 车辆长度，单位米，用于构造冲突检测 footprint。
      vehicle_length: 3.7

      # 车辆宽度，单位米，用于构造冲突检测 footprint。
      vehicle_width: 1.85

      # 本车定位输入话题，提供当前位置和姿态。
      localization_topic: /vehicle_1/odomData

      # 本车底盘输入话题，提供当前速度等状态。
      chassis_topic: /vehicle_1/chassis

      # 本车 planner 发布的候选轨迹话题，冲突模块基于它做预判。
      candidate_topic: /vehicle_1/trajectory_candidate

      # 本车冲突消解决策输出话题，planner 订阅后做速度处理。
      constraint_topic: /vehicle_1/conflict_constraint
    "1":
      # 车辆字符串 ID，会写入 ConflictConstraint.ego_id / peer_id。
      id: vehicle_2

      # 静态优先级，数字越小优先级越高。当前 vehicle_2 低于 vehicle_1。
      priority: 1

      # 名义速度，单位 m/s。用于部分预测兜底和评分归一化。
      nominal_speed: 2.0

      # 车辆长度，单位米，用于构造冲突检测 footprint。
      vehicle_length: 3.7

      # 车辆宽度，单位米，用于构造冲突检测 footprint。
      vehicle_width: 1.85

      # 本车定位输入话题，提供当前位置和姿态。
      localization_topic: /vehicle_2/odomData

      # 本车底盘输入话题，提供当前速度等状态。
      chassis_topic: /vehicle_2/chassis

      # 本车 planner 发布的候选轨迹话题，冲突模块基于它做预判。
      candidate_topic: /vehicle_2/trajectory_candidate

      # 本车冲突消解决策输出话题，planner 订阅后做速度处理。
      constraint_topic: /vehicle_2/conflict_constraint
