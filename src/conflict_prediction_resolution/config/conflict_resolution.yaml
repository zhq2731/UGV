# 冲突消解算法参数（planner 内部的 ConflictConstraintProcessor 使用）。
# 该文件只描述“收到冲突决策后，如何在当前规划轨迹上做让行速度处理”。

# 冲突约束消息超时时间，单位秒。超过该时间未收到新约束时，不继续使用旧让行决策。
conflict_constraint_timeout: 1.5

# 冲突约束超时时的保守限速，单位 m/s。该参数不是冲突模块输出速度，只是通信/决策中断兜底。
conflict_timeout_max_speed: 1.0

# 停车兜底减速度，单位 m/s^2。越大表示允许更晚、更急地降速到停车点。
conflict_deceleration_limit: 1.5

# 从当前轨迹投影出的冲突入口向后预留的停车安全距离，单位米。
conflict_stop_margin: 1.0

# 在 conflict_stop_margin 基础上额外提前的停车缓冲距离，单位米。
conflict_stop_buffer: 0.0

# 根据 target_entry_time 反推的让行速度低于该值时，不再低速爬行，改为停车等待。
conflict_min_smooth_yield_speed: 0.3

# 冲突入口/出口绝对坐标投影到当前轨迹时允许的最大横向误差，单位米。
conflict_projection_max_lateral_error: 2.0

# 投影后的冲突入口/出口在当前轨迹 s 坐标上至少应有的间隔，单位米。
conflict_projection_min_s_gap: 0.2
