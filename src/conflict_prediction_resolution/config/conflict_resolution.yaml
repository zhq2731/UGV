# 冲突消解算法参数（planner 内部的 ConflictConstraintProcessor 使用）。
# 该文件只描述“收到冲突决策后，如何在当前规划轨迹上做让行速度处理”。

# 冲突约束消息超时时间，单位秒。超过该时间未收到新约束时，不继续使用上一帧让行决策。
conflict_constraint_timeout: 2.1

# 冲突约束超时时的保守速度上限，单位 m/s。
# 超时后不再使用上一帧冲突入口/目标时间，但会限制非拼接段速度，避免车辆恢复高速。
conflict_timeout_max_speed: 1.0

# 停车等待减速度，单位 m/s^2。
# STOP_AND_WAIT 会从当前规划起点开始按该减速度刹停，并在停住后等待先行车通过。
# 数值越大，停车距离越短、制动越强；数值越小，停车更柔和但需要更长距离。
conflict_deceleration_limit: 1.5

# 安全冗余停车减速度，单位 m/s^2。
# 当规则停车轨迹无法通过控制器输入校验时，使用该较高减速度生成一条停车兜底轨迹。
conflict_emergency_stop_deceleration: 2.5

# 从当前轨迹投影出的冲突入口向后预留的停车安全距离，单位米。
conflict_stop_margin: 1.0

# 在 conflict_stop_margin 基础上额外提前的停车缓冲距离，单位米。
conflict_stop_buffer: 0.0

# 冲突入口/出口绝对坐标投影到当前轨迹时允许的最大横向误差，单位米。
conflict_projection_max_lateral_error: 2.0

# 投影后的冲突入口/出口在当前轨迹 s 坐标上至少应有的间隔，单位米。
conflict_projection_min_s_gap: 0.2

# planning_start_point 与当前轨迹最近点的最大匹配距离，单位米。
# 冲突规则速度处理器用该点检测拼接段末点，只修改该点之后的非拼接轨迹段。
# 若最近距离超过该阈值，则认为无法可靠识别拼接段，退化为从轨迹起点后开始处理。
conflict_stitching_start_match_max_distance: 1.0

# 单次规划循环时间，单位秒。冲突处理器会把匹配到的 planning_start_point
# 即拼接段末点的 relative_time 规范为该值，其余拼接前缀点按时间间隔向前递推。
conflict_planning_cycle_time: 0.1
