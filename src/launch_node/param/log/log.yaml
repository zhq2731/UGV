#fileLevel和consoleLevel：打印或者写文件的等级
#LEVEL_TRACE = 0x00,
#LEVEL_DEBUG = 0x01,
#LEVEL_INFO = 0x02,
#LEVEL_WARN = 0x03,
#LEVEL_ERROR = 0x04,
#LEVEL_CRITICAL = 0x05,
#LEVEL_OFF = 0x06    #关闭打印或者 写文件

#单位是M
#滚动存储的文件个数

#file：文件名称，文件会存储在家目录的log文件夹下
#loggerName：随便给自己的logger起一个名字
#max_size： 日志记录文件单个文件的最大容量 单位M
#max_files：滚动存储文件的个数。相当于总的日志是max_size* max_files

chassis_driver_node: #与包名对应
    fileLevel: 3
    consoleLevel: 1
    file: "chassis_driver_node.txt"
    loggerName: "chassis_driver_node_logger"
    max_size: 10.0 #单位是M
    max_files: 10 #滚动存储的文件个数    
