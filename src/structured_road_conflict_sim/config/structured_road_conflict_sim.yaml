road_network_node:
  frame_id: map
  # 场景可选：
  #   unprotected_left_turn: 两车，一车直行、一车无保护左转
  #   left_right_turn_conflict: 两车，一车左转、一车右转后汇入同一出口车道
  #   four_way_straight: 四车，十字路口四车均直线行驶
  scenario: unprotected_left_turn
  # unprotected_left_turn 下直行车与左转车的关系：
  #   opposing_approach: 与左转车原始进入方向对向而行
  #   same_after_turn: 与左转车转弯完成后的路线方向相同
  #   opposite_after_turn: 与左转车转弯完成后的路线方向相反
  left_turn_straight_relation: same_after_turn
  # 0 表示按 scenario 自动选择车辆数；也可以手动写 2/4 覆盖。
  vehicle_count: 0
  lane_length: 26.0
  lane_width: 3.5
  sample_spacing: 0.25
  publish_rate: 1.0
  road_markers_topic: /structured_road/markers
  vehicles:
    "0":
      id: vehicle_1
      priority: 0
      nominal_speed: 2.0
      candidate_topic: /vehicle_1/trajectory_candidate
      path_topic: /vehicle_1/planned_path
    "1":
      id: vehicle_2
      priority: 1
      nominal_speed: 2.0
      candidate_topic: /vehicle_2/trajectory_candidate
      path_topic: /vehicle_2/planned_path
    "2":
      id: vehicle_3
      priority: 2
      nominal_speed: 1.6
      candidate_topic: /vehicle_3/trajectory_candidate
      path_topic: /vehicle_3/planned_path
    "3":
      id: vehicle_4
      priority: 3
      nominal_speed: 1.6
      candidate_topic: /vehicle_4/trajectory_candidate
      path_topic: /vehicle_4/planned_path
conflict_resolver_node:
  frame_id: map
  # 0 表示跟随 road_network_node/scenario 自动选择车辆数；也可以手动写 2/4 覆盖。
  vehicle_count: 0
  decision_rate: 20.0
  prediction_horizon: 20.0
  footprint_safety_margin: 0.7
  # 仅做纵向冲突消解：路径几何保持不变，通过改写 TrajectoryPoint.v/a/relative_time 重定时。
  enable_longitudinal_retiming: true
  conflict_time_clearance: 2.0
  minimum_yield_speed: 0.0
  # 冲突即将发生时让行车直接停车等待，避免低速爬入冲突区。
  yield_stop_time_threshold: 1.0
  # 避让判断中用于估算“是否还能在 s_in 前安全停车”的舒适减速度和停车裕度。
  comfortable_deceleration: 2.0
  stop_margin: 1.0
  retiming_acceleration_limit: 1.4
  retiming_deceleration_limit: 2.5
  # 评分项只在硬规则无法直接判定时生效；分数更高的车先行。
  # priority_weight：静态优先级；speed_weight：当前速度；progress_weight：路线进度；
  # ttc_weight：越接近冲突入口越倾向先行；yield_delay_weight：让行代价越大越倾向先行。
  priority_weight: 0.0
  speed_weight: 0.25
  progress_weight: 0.25
  ttc_weight: 0.25
  yield_delay_weight: 0.25
  score_tie_epsilon: 0.02
  # 当任一车距离冲突区入口足够近，或到达冲突区入口 TTC 足够短时，锁定该对车的通行/让行决策。
  enable_decision_lock: true
  decision_lock_distance: 6.0
  decision_lock_ttc: 3.0
  # 解锁距离大于锁定距离，形成滞回；锁定保持时间和切换阈值用于抑制反复翻转。
  decision_unlock_distance: 9.0
  minimum_lock_hold_time: 2.0
  decision_switch_margin: 0.15
  enable_conflict_resolution: true
  conflict_markers_topic: /trajectory_conflict/markers
  vehicles:
    "0":
      id: vehicle_1
      priority: 0
      nominal_speed: 2.0
      vehicle_length: 3.7
      vehicle_width: 1.85
      pose_topic: /vehicle_1/current_pose
      odom_topic: /vehicle_1/odom
      candidate_topic: /vehicle_1/trajectory_candidate
      approved_topic: /vehicle_1/approved_trajectory
      speed_limit_topic: /vehicle_1/speed_limit
      # 结构化 ST 约束发布给对应车辆的速度规划/仿真节点。
      constraint_topic: /vehicle_1/conflict_constraint
    "1":
      id: vehicle_2
      priority: 1
      nominal_speed: 2.0
      vehicle_length: 3.7
      vehicle_width: 1.85
      pose_topic: /vehicle_2/current_pose
      odom_topic: /vehicle_2/odom
      candidate_topic: /vehicle_2/trajectory_candidate
      approved_topic: /vehicle_2/approved_trajectory
      speed_limit_topic: /vehicle_2/speed_limit
      # 结构化 ST 约束发布给对应车辆的速度规划/仿真节点。
      constraint_topic: /vehicle_2/conflict_constraint
    "2":
      id: vehicle_3
      priority: 2
      nominal_speed: 1.6
      vehicle_length: 3.7
      vehicle_width: 1.85
      pose_topic: /vehicle_3/current_pose
      odom_topic: /vehicle_3/odom
      candidate_topic: /vehicle_3/trajectory_candidate
      approved_topic: /vehicle_3/approved_trajectory
      speed_limit_topic: /vehicle_3/speed_limit
      # 结构化 ST 约束发布给对应车辆的速度规划/仿真节点。
      constraint_topic: /vehicle_3/conflict_constraint
    "3":
      id: vehicle_4
      priority: 3
      nominal_speed: 1.6
      vehicle_length: 3.7
      vehicle_width: 1.85
      pose_topic: /vehicle_4/current_pose
      odom_topic: /vehicle_4/odom
      candidate_topic: /vehicle_4/trajectory_candidate
      approved_topic: /vehicle_4/approved_trajectory
      speed_limit_topic: /vehicle_4/speed_limit
      # 结构化 ST 约束发布给对应车辆的速度规划/仿真节点。
      constraint_topic: /vehicle_4/conflict_constraint
vehicle_1:
  speed_planner_node:
    vehicle_id: vehicle_1
    candidate_topic: trajectory_candidate
    constraint_topic: conflict_constraint
    final_topic: trajectory_final
    planning_rate: 20.0
    constraint_timeout: 0.8
    nominal_speed_limit: 100.0
    acceleration_limit: 1.4
    deceleration_limit: 2.5
    stop_speed_epsilon: 0.05
  vehicle_kinematic_sim_node:
    vehicle_id: vehicle_1
    trajectory_topic: trajectory_final
    speed_limit_topic: ""
    pose_topic: current_pose
    odom_topic: odom
    marker_topic: vehicle_markers
    base_frame_id: vehicle_1/base_link
    simulation_rate: 30.0
    vehicle_length: 3.7
    vehicle_width: 1.85
    acceleration_limit: 1.8
    deceleration_limit: 3.0
    color_r: 0.05
    color_g: 0.30
    color_b: 0.85
    publish_tf: true
    restart_on_new_trajectory: false

